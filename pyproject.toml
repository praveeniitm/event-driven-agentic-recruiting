[project]
name = "event-driven-agentic-recruiting"
version = "0.1.0"
description = "Event-driven multi-agent recruiting pipeline on Kafka, LangGraph and bytewax"
requires-python = ">=3.11,<3.13"
dependencies = [
  "confluent-kafka[avro,schemaregistry]>=2.5,<2.6",
  "fastavro>=1.9",
  "bytewax>=0.21",
  "langgraph>=0.2",
  "langchain-core>=0.3",
  "langchain-openai>=0.2",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "gradio>=4.40",
  "psycopg[binary]>=3.2",
  "prometheus-client>=0.20",
  "httpx>=0.27",
  "pandas>=2.0",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/recruiting"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs the docker compose stack running"]
addopts = "-m 'not integration'"

[tool.ruff]
line-length = 110
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "B"]
ignore = ["E501"]  # long lines: formatting is not enforced
