groups:
  - name: recruiting
    rules:
      - alert: MessagesInDeadLetterQueue
        expr: increase(recruiting_dlq_messages_total[5m]) > 0
        labels: {severity: warning}
        annotations: {summary: "{{ $labels.service }} routed messages to a DLQ ({{ $labels.reason }})"}
      - alert: ConsumerLagGrowing
        expr: sum by (consumergroup) (kafka_consumergroup_lag{consumergroup=~"resume-parser-group|matching-agent-group"}) > 50
        for: 2m
        labels: {severity: critical}
        annotations: {summary: "Consumer group {{ $labels.consumergroup }} is falling behind"}
      - alert: LLMErrorRateHigh
        expr: sum by (service) (rate(recruiting_llm_calls_total{status="error"}[5m])) / sum by (service) (rate(recruiting_llm_calls_total[5m])) > 0.2
        for: 2m
        labels: {severity: critical}
        annotations: {summary: "More than 20% of LLM calls fail in {{ $labels.service }}"}
      - alert: LLMSlow
        expr: histogram_quantile(0.95, sum by (le, service) (rate(recruiting_llm_latency_seconds_bucket[5m]))) > 10
        for: 5m
        labels: {severity: warning}
        annotations: {summary: "p95 LLM latency above 10s in {{ $labels.service }}"}
