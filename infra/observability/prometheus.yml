global:
  scrape_interval: 5s   # PROD: 15-30s
rule_files:
  - /etc/prometheus/alerts.yml
scrape_configs:
  # App services publish their metrics ports on the host in both modes (host processes or `--profile apps` containers).
  - job_name: recruiting-services
    static_configs:
      - targets: ["host.docker.internal:8001"]
        labels: {service: parser}
      - targets: ["host.docker.internal:8002"]
        labels: {service: matching}
      - targets: ["host.docker.internal:8003"]
        labels: {service: analytics}
  # Consumer lag, partition offsets, topic sizes
  - job_name: kafka-exporter
    static_configs:
      - targets: ["kafka-exporter:9308"]
# PROD: Alertmanager (PagerDuty / Slack) and service discovery (Kubernetes) instead of static targets.
